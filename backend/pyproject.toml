[project]
name = "mccauley-backend"
version = "0.1.0"
description = "Conversational feedback agent — backend (v0.1)"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "itsdangerous>=2.2",
  "httpx>=0.27",
  "anthropic>=0.39",
  "voyageai>=0.3",
  "google-cloud-speech>=2.27",
  "google-cloud-texttospeech>=2.21",
  "websockets>=13",
  "rapidfuzz>=3.10",
  "python-frontmatter>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "black>=24.10",
  "mypy>=1.13",
  "respx>=0.21",
  "testcontainers[postgres]>=4.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]  # line length handled by black

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false

# Third-party libraries without published type stubs. Suppressing the
# import-related noise lets `strict = true` flag real issues in our own code.
[[tool.mypy.overrides]]
module = [
    "pgvector.*",
    "voyageai",
    "voyageai.*",
    "frontmatter",
    "google.*",
    "testcontainers.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
